<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB" />
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2F80ED" />
    </marker>
  </defs>
  <g id="header">
    <text x="60" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">9 张原始表先清洗落库，再进入预聚合刷新</text>
    <path fill="#00A6A6" fill-opacity="0.10" d="M68,82 H1212 A8,8 0 0 1 1220,90 V116 A8,8 0 0 1 1212,124 H68 A8,8 0 0 1 60,116 V90 A8,8 0 0 1 68,82 Z" />
    <text x="80" y="109" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">核心结论：数据清洗保证上层 Agent 查询的数据可 JOIN、可解释、可索引</text>
  </g>
  <g id="pipeline">
    <g id="step-raw">
      <path fill="#FFFFFF" stroke="#D6E0EA" d="M84,190 H286 A14,14 0 0 1 300,204 V346 A14,14 0 0 1 286,360 H84 A14,14 0 0 1 70,346 V204 A14,14 0 0 1 84,190 Z" />
      <text x="94" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" fill="#17324D">Olist 原始 CSV</text>
      <text x="94" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#2F80ED">9 表</text>
      <text x="94" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">订单、商品、客户、卖家</text>
      <text x="94" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">支付、评价、地理、翻译</text>
    </g>
    <line x1="315" y1="275" x2="408" y2="275" stroke="#2F80ED" stroke-width="3" marker-end="url(#arrowHead)" />
    <g id="step-clean">
      <path fill="#FFFFFF" stroke="#D6E0EA" d="M434,170 H666 A14,14 0 0 1 680,184 V366 A14,14 0 0 1 666,380 H434 A14,14 0 0 1 420,366 V184 A14,14 0 0 1 434,170 Z" />
      <text x="448" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" fill="#17324D">加载即清洗</text>
      <text x="448" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2937">时间字段标准化</text>
      <text x="448" y="284" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2937">重复订单/评价去除</text>
      <text x="448" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2937">品类翻译缺失补全</text>
      <text x="448" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2937">地理表按邮编聚合</text>
    </g>
    <line x1="695" y1="275" x2="788" y2="275" stroke="#2F80ED" stroke-width="3" marker-end="url(#arrowHead)" />
    <g id="step-db">
      <path fill="#17324D" d="M814,190 H996 A14,14 0 0 1 1010,204 V346 A14,14 0 0 1 996,360 H814 A14,14 0 0 1 800,346 V204 A14,14 0 0 1 814,190 Z" />
      <text x="828" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">MySQL 8.0</text>
      <text x="828" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF">utf8mb4</text>
      <text x="828" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#D6E0EA">关键 JOIN 字段建索引</text>
      <text x="828" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#D6E0EA">支持葡语评论文本</text>
    </g>
    <line x1="1025" y1="275" x2="1102" y2="275" stroke="#2F80ED" stroke-width="3" marker-end="url(#arrowHead)" />
    <g id="step-views">
      <path fill="#2F80ED" d="M1124,170 H1206 A14,14 0 0 1 1220,184 V366 A14,14 0 0 1 1206,380 H1124 A14,14 0 0 1 1110,366 V184 A14,14 0 0 1 1124,170 Z" />
      <text x="1165" y="224" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">8</text>
      <text x="1165" y="258" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#FFFFFF">物化表</text>
      <text x="1165" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#D6E0EA">6 业务</text>
      <text x="1165" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#D6E0EA">2 地理</text>
    </g>
  </g>
  <g id="bottom-evidence">
    <path fill="#FFFFFF" stroke="#D6E0EA" d="M104,445 H1166 A14,14 0 0 1 1180,459 V557 A14,14 0 0 1 1166,571 H104 A14,14 0 0 1 90,557 V459 A14,14 0 0 1 104,445 Z" />
    <text x="120" y="488" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17324D">关键预处理效果</text>
    <text x="120" y="526" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">geolocation 从约 100 万行聚合到约 1.9 万邮编前缀，避免后续地理 JOIN 膨胀。</text>
    <text x="120" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">order_reviews 每个订单保留一条评价，review_score 限定 1-5 分，文本空值填充为空字符串。</text>
  </g>
  <g id="footer">
    <text x="60" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: utils/data_clean.py, utils/db_init.py, docs/01_data.md</text>
    <text x="1220" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">05 / 18</text>
  </g>
</svg>