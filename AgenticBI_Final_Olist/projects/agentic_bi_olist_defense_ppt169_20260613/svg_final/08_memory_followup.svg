<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB" />
  <g id="header">
    <text x="50" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">MemorySaver 与显式历史让追问不丢上下文</text>
    <path fill="#00A6A6" fill-opacity="0.10" d="M58,82 H1222 A8,8 0 0 1 1230,90 V116 A8,8 0 0 1 1222,124 H58 A8,8 0 0 1 50,116 V90 A8,8 0 0 1 58,82 Z" />
    <text x="70" y="109" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">核心结论：“那准时率呢？”会被改写为带上轮问题的完整分析任务</text>
  </g>
  <g id="chat-example">
    <path fill="#FFFFFF" stroke="#D6E0EA" d="M88,154 H596 A16,16 0 0 1 612,170 V586 A16,16 0 0 1 596,602 H88 A16,16 0 0 1 72,586 V170 A16,16 0 0 1 88,154 Z" />
