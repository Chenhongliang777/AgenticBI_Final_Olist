<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB" />
  <g id="background-decoration">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" fill-opacity="0.55" />
    <circle cx="1040" cy="160" r="150" fill="#2F80ED" fill-opacity="0.08" />
    <circle cx="250" cy="620" r="170" fill="#00A6A6" fill-opacity="0.08" />
  </g>
  <g id="main-message">
    <text x="90" y="126" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="bold" fill="#17324D">固定看板无法覆盖复杂运营追问</text>
    <text x="92" y="174" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#52677A">Agentic BI 的价值，在于让系统主动规划分析，而不是只展示预设图表。</text>
  </g>
  <g id="contrast-lines">
    <line x1="150" y1="280" x2="1130" y2="280" stroke="#D6E0EA" stroke-width="2" />
    <line x1="150" y1="420" x2="1130" y2="420" stroke="#D6E0EA" stroke-width="2" />
    <g id="contrast-1">
      <text x="170" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#C62828">传统 BI</text>
      <text x="360" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">只能回答已设计好的维度</text>
      <text x="850" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F80ED">Agentic BI</text>
      <text x="1000" y="250" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">自动拆解新问题</text>
    </g>
    <g id="contrast-2">
      <text x="170" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#C62828">多表查询</text>
      <text x="360" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">实时 JOIN 容易拖慢交互</text>
      <text x="850" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F80ED">预聚合层</text>
      <text x="1000" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">高频指标直接 SELECT</text>
    </g>
    <g id="contrast-3">
      <text x="170" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#C62828">业务追问</text>
      <text x="360" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">需要上下文、解释和行动建议</text>
      <text x="850" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F80ED">多 Agent</text>
      <text x="1000" y="530" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2937">查询、预测、NLP、决策协同</text>
    </g>
  </g>
  <g id="takeaway">
    <path fill="#17324D" d="M276,594 H1004 A26,26 0 0 1 1030,620 V620 A26,26 0 0 1 1004,646 H276 A26,26 0 0 1 250,620 V620 A26,26 0 0 1 276,594 Z" />
    <text x="640" y="628" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">目标：让非技术业务人员直接获得“数据结果 + 图表 + 策略”</text>
  </g>
  <g id="footer">
    <text x="60" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: 商案项目背景与 Agentic BI 要求</text>
    <text x="1220" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">03 / 18</text>
  </g>
</svg>