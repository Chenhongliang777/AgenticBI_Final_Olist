<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB"/>
  <g id="header">
    <text x="50" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">描述性分析优先命中州级、配送和支付视图</text>
    <rect x="50" y="82" width="1180" height="42" rx="8" fill="#2F80ED" fill-opacity="0.10"/>
    <text x="70" y="109" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">核心结论：用户一个复合问题即可得到州销售、准时率和支付偏好</text>
  </g>
  <g id="chart">
    <rect x="56" y="150" width="742" height="530" rx="12" fill="#FFFFFF" stroke="#D6E0EA"/>
    <image href="../images/geo_state_gmv_bar.png" x="82" y="180" width="690" height="493" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="right-panel">
    <rect x="836" y="150" width="394" height="530" rx="14" fill="#FFFFFF" stroke="#D6E0EA"/>
    <text x="866" y="204" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17324D">复合问题拆解</text>
    <g id="view-1">
      <rect x="866" y="238" width="300" height="58" rx="10" fill="#2F80ED" fill-opacity="0.10"/>
      <text x="888" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2F80ED">mv_state_sales</text>
      <text x="1046" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">州级 GMV 排名</text>
    </g>
    <g id="view-2">
      <rect x="866" y="316" width="300" height="58" rx="10" fill="#00A6A6" fill-opacity="0.10"/>
      <text x="888" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#00A6A6">mv_delivery_perf</text>
      <text x="1046" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">准时率与延迟</text>
    </g>
    <g id="view-3">
      <rect x="866" y="394" width="300" height="58" rx="10" fill="#F2994A" fill-opacity="0.14"/>
      <text x="888" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#F2994A">mv_payment_dist</text>
      <text x="1046" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">支付偏好</text>
    </g>
    <line x1="866" y1="488" x2="1184" y2="488" stroke="#D6E0EA"/>
    <text x="866" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17324D">答辩讲法</text>
    <text x="866" y="562" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">先展示图表，再打开数据表区域。</text>
    <text x="866" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">强调 SQL Agent 的视图优先策略。</text>
  </g>
  <g id="footer">
    <text x="50" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: data/artifacts/demo/geo_state_gmv_bar.png, docs/04_qa_test.md</text>
    <text x="1230" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">10 / 18</text>
  </g>
</svg>
