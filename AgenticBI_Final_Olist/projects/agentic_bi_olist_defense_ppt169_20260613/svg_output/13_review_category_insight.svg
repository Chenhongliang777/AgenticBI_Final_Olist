<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB"/>
  <g id="header">
    <text x="50" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">评分与品类热力图帮助定位服务质量优先级</text>
    <rect x="50" y="82" width="1180" height="42" rx="8" fill="#00A6A6" fill-opacity="0.10"/>
    <text x="70" y="109" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">核心结论：把“哪些品类更容易低评分”转化为客服、履约和卖家治理排序</text>
  </g>
  <g id="heatmap">
    <rect x="56" y="150" width="704" height="500" rx="12" fill="#FFFFFF" stroke="#D6E0EA"/>
    <image href="../images/heatmap_category_rating.png" x="88" y="175" width="640" height="450" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="right-panel">
    <rect x="794" y="150" width="416" height="500" rx="14" fill="#FFFFFF" stroke="#D6E0EA"/>
    <text x="826" y="201" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17324D">经营解释框架</text>
    <g id="card-1">
      <rect x="826" y="234" width="330" height="76" rx="10" fill="#C62828" fill-opacity="0.08" stroke="#D6E0EA"/>
      <text x="850" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#C62828">低评分品类</text>
      <text x="850" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">优先检查破损、延迟、描述不符问题</text>
    </g>
    <g id="card-2">
      <rect x="826" y="330" width="330" height="76" rx="10" fill="#2E7D32" fill-opacity="0.08" stroke="#D6E0EA"/>
      <text x="850" y="361" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">高评分品类</text>
      <text x="850" y="388" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">适合作为复购、推荐和供给扩张抓手</text>
    </g>
    <g id="card-3">
      <rect x="826" y="426" width="330" height="76" rx="10" fill="#2F80ED" fill-opacity="0.10" stroke="#D6E0EA"/>
      <text x="850" y="457" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F80ED">异常交叉点</text>
      <text x="850" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">继续追问到订单明细和卖家维度</text>
    </g>
    <line x1="826" y1="535" x2="1160" y2="535" stroke="#D6E0EA"/>
    <text x="826" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">答辩落点</text>
    <text x="826" y="604" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">同一张图既服务业务解释，也服务后续追问。</text>
  </g>
  <g id="footer">
    <text x="50" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: data/artifacts/demo/heatmap_category_rating.png, docs/05_results.md</text>
    <text x="1230" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">13 / 18</text>
  </g>
</svg>
