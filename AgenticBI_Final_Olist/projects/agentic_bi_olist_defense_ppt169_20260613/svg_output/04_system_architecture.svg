<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB"/>
  <g id="header">
    <text x="50" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">系统采用“数据层 + 预聚合层 + 多 Agent 层 + Web 层”</text>
    <rect x="50" y="82" width="1180" height="42" rx="8" fill="#2F80ED" fill-opacity="0.10"/>
    <text x="70" y="109" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17324D">核心结论：四层架构把离线数据工程与在线智能分析连接起来</text>
  </g>
  <g id="architecture-image">
    <rect x="50" y="150" width="790" height="447" rx="12" fill="#FFFFFF" stroke="#D6E0EA"/>
    <image href="../images/architecture.png" x="70" y="166" width="750" height="424" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="insight-panel">
    <rect x="880" y="150" width="350" height="447" rx="14" fill="#FFFFFF" stroke="#D6E0EA"/>
    <text x="908" y="204" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">架构亮点</text>
    <g id="architecture-point-1">
      <rect x="908" y="238" width="282" height="90" rx="10" fill="#2F80ED" fill-opacity="0.10"/>
      <text x="928" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F80ED">离线预计算</text>
      <text x="928" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">高频 KPI 在 MySQL 物化表中提前计算</text>
    </g>
    <g id="architecture-point-2">
      <rect x="908" y="352" width="282" height="90" rx="10" fill="#00A6A6" fill-opacity="0.10"/>
      <text x="928" y="384" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#00A6A6">在线智能编排</text>
      <text x="928" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">Coordinator 根据意图只调用必要 Agent</text>
    </g>
    <g id="architecture-point-3">
      <rect x="908" y="466" width="282" height="90" rx="10" fill="#F2994A" fill-opacity="0.12"/>
      <text x="928" y="498" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F2994A">交互闭环</text>
      <text x="928" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#52677A">问答、图表、策略建议在 Web 端统一展示</text>
    </g>
  </g>
  <g id="footer">
    <text x="50" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: docs/architecture.png</text>
    <text x="1230" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">04 / 18</text>
  </g>
</svg>
