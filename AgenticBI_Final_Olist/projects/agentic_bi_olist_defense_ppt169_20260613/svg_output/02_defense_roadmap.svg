<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F9FB"/>
  <g id="header">
    <text x="60" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17324D">10 分钟答辩围绕“数据、Agent、Demo、决策”展开</text>
    <text x="60" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">从业务问题出发，最终落到可运行系统和运营策略</text>
    <line x1="60" y1="124" x2="1220" y2="124" stroke="#D6E0EA" stroke-width="2"/>
  </g>
  <g id="agenda-list">
    <rect x="70" y="160" width="1140" height="420" rx="14" fill="#FFFFFF" stroke="#D6E0EA"/>
    <g id="agenda-1">
      <circle cx="132" cy="218" r="24" fill="#2F80ED"/>
      <text x="132" y="226" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
      <text x="178" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">背景与数据挑战</text>
      <text x="178" y="238" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">Olist 9 表、多维业务链路、固定看板的局限</text>
    </g>
    <g id="agenda-2">
      <circle cx="132" cy="296" r="24" fill="#00A6A6"/>
      <text x="132" y="304" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
      <text x="178" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">系统架构</text>
      <text x="178" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">数据层、预聚合层、多 Agent 层、Web UI 的端到端链路</text>
    </g>
    <g id="agenda-3">
      <circle cx="132" cy="374" r="24" fill="#F2994A"/>
      <text x="132" y="382" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
      <text x="178" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">预聚合加速</text>
      <text x="178" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">同一月度 GMV 查询：原始 JOIN vs 物化视图</text>
    </g>
    <g id="agenda-4">
      <circle cx="132" cy="452" r="24" fill="#2F80ED"/>
      <text x="132" y="460" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
      <text x="178" y="444" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">多 Agent 协作</text>
      <text x="178" y="472" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">Coordinator 规划、条件路由、MemorySaver、多轮追问</text>
    </g>
    <g id="agenda-5">
      <circle cx="132" cy="530" r="24" fill="#00A6A6"/>
      <text x="132" y="538" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">5</text>
      <text x="178" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324D">Demo 与决策建议</text>
      <text x="178" y="550" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#52677A">三类现场问题验证描述、诊断、What-if 和运营策略</text>
    </g>
  </g>
  <g id="right-summary">
    <rect x="860" y="194" width="300" height="324" rx="16" fill="#17324D"/>
    <text x="894" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">18 页</text>
    <text x="894" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#D6E0EA">覆盖最终提交要求</text>
    <line x1="894" y1="322" x2="1128" y2="322" stroke="#D6E0EA" stroke-opacity="0.5"/>
    <text x="894" y="364" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">8-10 分钟</text>
    <text x="894" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">3 个现场 Demo</text>
    <text x="894" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">1 条决策闭环</text>
  </g>
  <g id="footer">
    <text x="60" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: 分工清单 D4/D5 与项目报告</text>
    <text x="1220" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#94A3B8">02 / 18</text>
  </g>
</svg>
